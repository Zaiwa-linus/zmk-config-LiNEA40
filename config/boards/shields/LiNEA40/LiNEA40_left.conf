CONFIG_NFCT_PINS_AS_GPIOS=y

# ZMK's board-level seeeduino_xiao_ble.conf turns ZMK_USB on, but a split
# peripheral cannot satisfy its dependency. Disable it here to avoid the
# Kconfig warning; the left half talks to the central over BLE only.
CONFIG_ZMK_USB=n

# EC11 Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

# Report this half's own battery level to the central.
# ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_{PROXY,FETCHING} are central-only options
# and belong in LiNEA40_right.conf, not here.
CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
